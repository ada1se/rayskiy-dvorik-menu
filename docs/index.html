<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Меню — Райский дворик</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- ======== SEARCH OVERLAY ======== -->
    <!-- Header bar: [circle-btn] [search-pill] [circle-X] -->
    <div class="search-overlay" id="search-overlay">
        <div class="search-bar-row">
            <button class="circle-btn search-history-btn" title="История">
                <span class="material-symbols-rounded">history</span>
            </button>
            <div class="search-pill">
                <span class="material-symbols-rounded search-pill-icon">search</span>
                <input type="text" id="search-input" placeholder="Поиск блюд...">
            </div>
            <button class="circle-btn" onclick="closeSearch()">
                <span class="material-symbols-rounded">close</span>
            </button>
        </div>
        <main id="search-results"></main>
    </div>

    <!-- ======== MENU PAGE ======== -->
    <div class="page active" id="page-menu">
        <div class="sticky-cats">
            <div class="chips-row" id="categories-container"></div>
        </div>
        <main id="menu-container"></main>
    </div>

    <!-- ======== CART PAGE ======== -->
    <div class="page" id="page-cart">
        <div class="page-header"><h2 class="page-title">Корзина</h2></div>
        <div id="cart-items-container" class="cart-list"></div>
        <div class="cart-total-bar">
            <span class="cart-total-label">Итого</span>
            <span id="cart-total" class="cart-total-price">0 ₸</span>
        </div>
    </div>

    <!-- ======== RULES PAGE ======== -->
    <div class="page" id="page-rules">
        <!-- Welcome banner (was hero) -->
        <div class="welcome-banner">
            <img src="images/logo.png" alt="Логотип" class="welcome-logo" onerror="this.style.display='none'">
            <div class="welcome-text">
                <h1 class="welcome-title">Райский дворик</h1>
                <p class="welcome-sub">Добро пожаловать!</p>
            </div>
        </div>

        <div id="restaurant-rules" class="rules-body"></div>

        <div class="qr-section">
            <p class="qr-label">Поделиться меню</p>
            <div id="qrcode"></div>
            <p class="qr-hint">Отсканируйте QR-код</p>
        </div>
    </div>

    <!-- ======== BOTTOM NAV — iOS 26 style ======== -->
    <!-- Left pill: main tabs | Right circle: search -->
    <div class="bottom-bar">
        <nav class="main-island" id="main-island">
            <button class="nav-tab active" data-tab="menu" onclick="switchTab('menu')">
                <span class="material-symbols-rounded">restaurant_menu</span>
                <span class="nav-label">Меню</span>
            </button>
            <button class="nav-tab" data-tab="cart" onclick="switchTab('cart')">
                <div class="nav-icon-wrap">
                    <span class="material-symbols-rounded">shopping_bag</span>
                    <span class="cart-dot" id="cart-dot" style="display:none"></span>
                </div>
                <span class="nav-label">Корзина</span>
            </button>
            <button class="nav-tab" data-tab="rules" onclick="switchTab('rules')">
                <span class="material-symbols-rounded">info</span>
                <span class="nav-label">Внимание</span>
            </button>
        </nav>

        <button class="search-circle" onclick="openSearch()" id="search-circle">
            <span class="material-symbols-rounded">search</span>
        </button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
